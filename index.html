<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#a7abb1">
<title>محاكاة خدمة USSD</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:Cairo;src:local("Cairo")}*{box-sizing:border-box}
:root{--blue:#1685f7;--bg:#a7abb1;--ink:#202124}
html,body{margin:0;width:100%;height:100%;font-family:Cairo,"Noto Sans Arabic",Arial,sans-serif;background:#777a7f;color:var(--ink);overflow:hidden}
button,input{font:inherit} .phone{height:100dvh;max-width:480px;margin:auto;position:relative;background:#a7abb1;overflow:hidden}
.status{height:28px;padding:4px 16px;display:flex;justify-content:space-between;color:#f8f8f8;font-size:14px;direction:ltr}
.dial-area{position:absolute;left:0;right:0;bottom:0;height:65%;background:#a7abb1;border-radius:34px 34px 0 0;padding:16px 14px 72px}
.display{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 10px}
#dial{width:100%;background:transparent;border:0;outline:0;text-align:center;font-size:30px;color:#171717;direction:ltr}
.erase{font-size:27px;color:#62666c;border:0;background:transparent;padding:6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:clamp(64px,10.4vh,91px);border:0;border-radius:60px;background:#d0d0d0;color:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 1px 1px #8884}
.key .num{font-family:Arial,sans-serif;font-size:clamp(28px,6vw,42px);line-height:1.15}
.key small{font-size:15px;color:#3b3b3b;margin-top:3px}
.call{margin-top:12px;width:100%;height:52px;border:0;border-radius:30px;background:#39a85a;color:white;font-size:18px}
.nav{position:absolute;bottom:0;height:28px;left:0;right:0;display:flex;align-items:center;justify-content:space-around;color:#eee;background:#a7abb1}
.nav span{font-size:20px;opacity:.7}
.scrim{position:absolute;inset:0;background:#0005;display:none;z-index:4}
.sheet{position:absolute;z-index:5;bottom:0;left:0;right:0;background:#fff;border-radius:32px 32px 0 0;padding:28px 28px max(30px,env(safe-area-inset-bottom));display:none;box-shadow:0 -2px 14px #0001}
.sheet.show{display:block}.scrim.show{display:block}
.sheet h2{font-size:24px;font-weight:500;text-align:center;margin:18px 0 38px;color:#111}
.message{font-size:23px;line-height:1.55;text-align:right;white-space:pre-line;color:#414141;min-height:44px;margin-bottom:24px}
.ussd-input{width:100%;height:86px;border:3px solid var(--blue);border-radius:34px;background:#f0f0f0;outline:0;text-align:right;padding:0 18px;font-size:24px;direction:ltr;margin-bottom:28px}
.actions{display:flex;gap:14px;direction:ltr}
.actions button{height:58px;border:0;border-radius:40px;flex:1;font-size:23px}
.send{background:var(--blue);color:white}.cancel{background:#f0f0f0;color:#333}
.ok{width:100%;background:var(--blue);color:white;border:0;border-radius:40px;height:58px;font-size:23px}
.hint{font-size:12px;text-align:center;color:#6b6b6b;margin-top:12px}
@media(max-height:700px){.dial-area{height:70%;padding-bottom:55px}.key{height:58px}.sheet{padding-top:14px}.sheet h2{margin:10px 0 20px}.message{font-size:19px;margin-bottom:14px}.ussd-input{height:64px;margin-bottom:18px}.actions button,.ok{height:50px}}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>◈ ▰ ▴</span><span>◉ ▣ ◉ ٧:٥٩ م</span></div>
  <div class="dial-area">
    <div class="display"><button class="erase" id="erase" aria-label="مسح">⌫</button><input id="dial" aria-label="رقم الاتصال" readonly value=""></div>
    <div class="keypad" id="keypad"></div>
    <button class="call" id="call">اتصال</button>
  </div>
  <div class="nav"><span>◀</span><span>◯</span><span>□</span></div>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <h2>معلومات شركة الاتصالات</h2>
    <div class="message" id="message"></div>
    <input class="ussd-input" id="reply" inputmode="numeric" autocomplete="off" aria-label="الرد على رسالة الخدمة">
    <div class="actions"><button class="send" id="send">إرسال</button><button class="cancel" id="cancel">إلغاء</button></div>
    <div class="hint">محاكاة واجهة تعليمية — لا تُرسل طلبات حقيقية إلى شركة الاتصالات</div>
  </section>
</div>
<script>
const dial=document.getElementById('dial'), sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
const message=document.getElementById('message'), reply=document.getElementById('reply');
let stage=''; let destination='';
const keys=[['1','๑๑'],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
const keypad=document.getElementById('keypad');
keys.forEach(([n,s])=>{const b=document.createElement('button');b.className='key';b.innerHTML=`<span class="num">${n}</span><small>${s||'&nbsp;'}</small>`;b.onclick=()=>{dial.value+=n;if(dial.value==='*110#')openStage('menu')};keypad.appendChild(b)});
document.getElementById('erase').onclick=()=>dial.value=dial.value.slice(0,-1);
document.getElementById('call').onclick=()=>{if(dial.value==='*110#')openStage('menu');else if(dial.value)openStage('invalid')};
function openStage(s){stage=s;reply.value='';sheet.classList.add('show');scrim.classList.add('show');render();setTimeout(()=>reply.focus(),180)}
function closeStage(){sheet.classList.remove('show');scrim.classList.remove('show');reply.value='';}
function render(){
 let text='';
 if(stage==='menu')text='محفظة جوال باي\n1. التحويل لصديق\n2. الدفع لتاجر\n3. فحص الرصيد';
 else if(stage==='balance'){text='الرصيد الحالي : 2';document.querySelector('.ussd-input').style.display='none';document.querySelector('.actions').style.display='none';}
 else if(stage==='transfer-phone')text='ادخل رقم محفظة الصديق المراد التحويل له\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='transfer-amount')text='ادخل المبلغ المراد تحويله\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='transfer-confirm')text=`سيتم تحويل ${amount} شيقل إلى ${destination}\n1. للتأكيد\n2. للإلغاء`;
 else if(stage==='merchant')text='ادخل رقم التاجر المراد التحويل له\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='pin')text='ادخل الرقم السري (4 أرقام)\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='success'){text='تمت العملية بنجاح';document.querySelector('.ussd-input').style.display='none';document.querySelector('.actions').style.display='none';}
 else if(stage==='invalid')text='الرمز غير معروف في هذه المحاكاة.\nاكتب *110# لفتح القائمة.';
 else text='أدخل الاختيار';
 message.textContent=text;
 if(stage!=='balance'&&stage!=='success'){document.querySelector('.ussd-input').style.display='block';document.querySelector('.actions').style.display='flex'}
 document.getElementById('send').style.display=(stage==='balance'||stage==='success')?'none':'block';
 document.getElementById('cancel').textContent=(stage==='balance'||stage==='success')?'حسنًا':'إلغاء';
}
let amount='1';
document.getElementById('send').onclick=()=>{
 const v=reply.value.trim();
 if(stage==='menu'){if(v==='1')stage='transfer-phone';else if(v==='2')stage='merchant';else if(v==='3')stage='balance';else return}
 else if(stage==='transfer-phone'){if(v==='00'){stage='menu'}else if(v){destination=v;stage='transfer-amount'}else return}
 else if(stage==='transfer-amount'){if(v==='00')stage='menu';else if(v&&Number(v)>0){amount=String(Number(v));stage='pin'}else return}
 else if(stage==='pin'){if(v==='00')stage='menu';else if(/^\d{4}$/.test(v))stage='transfer-confirm';else {message.textContent='الرقم السري يجب أن يتكون من 4 أرقام';return}}
 else if(stage==='transfer-confirm'){if(v==='1')stage='success';else if(v==='2')stage='menu';else return}
 else if(stage==='merchant'){if(v==='00')stage='menu';else if(v)stage='pin';else return}
 else if(stage==='invalid'){stage='menu'}
 render();reply.value='';
};
document.getElementById('cancel').onclick=()=>{if(stage==='balance'||stage==='success'){closeStage();document.querySelector('.ussd-input').style.display='block';document.querySelector('.actions').style.display='flex';dial.value=''}else closeStage()};
scrim.onclick=closeStage;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStage();if(e.key==='Enter'&&sheet.classList.contains('show'))document.getElementById('send').click()});
</script>
</body>
</html>
